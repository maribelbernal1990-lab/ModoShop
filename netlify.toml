[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/products/:id"
  to = "/producto.html?id=:id"
  status = 200

[[redirects]]
  from = "/track/:id"
  to = "/seguimiento.html?id=:id"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/?cart=1"
  status = 200

[[redirects]]
  from = "/api/rate"
  to = "/.netlify/functions/rate"
  status = 200

[[redirects]]
  from = "/api/reviews-summary"
  to = "/.netlify/functions/reviews-summary"
