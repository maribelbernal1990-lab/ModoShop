<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento de pedido · ModoShop Venezuela</title><style>body{margin:0;background:#f7f7f5;color:#111318;font-family:Inter,system-ui,sans-serif}.wrap{width:min(760px,92%);margin:50px auto}.card{background:#fff;border:1px solid #e7e8eb;border-radius:24px;padding:28px;box-shadow:0 18px 55px #11131812}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;border-radius:50%;background:#000}.muted{color:#68707f}.form{display:flex;gap:8px;margin:20px 0}.form input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px}.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:750;cursor:pointer;background:#ed1c24;color:#fff}.status{display:inline-flex;padding:8px 11px;border-radius:999px;background:#fff1f1;color:#d91219;font-weight:750}.line{padding:12px 0;border-bottom:1px solid #eee}.success{color:#159a63}.error{color:#b42318}
/* Micro-interacción ModoShop: botones con vibración suave al pasar el cursor */
@keyframes msButtonVibrate{0%{transform:translateY(-3px) rotate(0deg)}20%{transform:translateY(-3px) rotate(-1.4deg)}40%{transform:translateY(-3px) rotate(1.4deg)}60%{transform:translateY(-3px) rotate(-1deg)}80%{transform:translateY(-3px) rotate(1deg)}100%{transform:translateY(-3px) rotate(0deg)}}
button:hover,.btn:hover{animation:msButtonVibrate .32s ease-in-out both;transform-origin:center;}
button:focus-visible,.btn:focus-visible{outline:3px solid rgba(237,28,36,.35);outline-offset:2px}
@media (prefers-reduced-motion:reduce){button:hover,.btn:hover{animation:none}}
</style></head><body><main class="wrap"><div class="card"><div class="brand"><img src="assets/logo.png"><div><h1 style="margin:0">ModoShop</h1><small>VENEZUELA</small></div></div><h2>Seguimiento de pedido</h2><p class="muted">Introduce tu número de pedido para consultar el estado.</p><div class="form"><input id="id" placeholder="Ej.: MS-20260925-ABC123"><button class="btn" onclick="track()">Consultar</button></div><div id="result"></div><p><a href="index.html">← Volver a ModoShop Venezuela</a></p></div></main><script>const statusText={pending:'Pendiente de despacho',confirmed:'Pedido confirmado',processing:'Preparando pedido',shipped:'Enviado',delivered:'Entregado',cancelled:'Cancelado'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}async function track(){const id=document.getElementById('id').value.trim();const out=document.getElementById('result');if(!id)return;out.innerHTML='Consultando…';try{const r=await fetch('/api/track?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'Pedido no encontrado');out.innerHTML=`<div class="status">${esc(statusText[d.status]||d.status)}</div><p><b>${esc(d.id)}</b><br><span class="muted">Creado: ${new Date(d.createdAt).toLocaleString('es-VE')}</span></p>${d.items.map(i=>`<div class="line">${esc(i.name)} × ${i.qty}</div>`).join('')}<p><b>Total:</b> $${Number(d.totalUsd).toFixed(2)} · ${Number(d.totalBs).toFixed(2)} Bs.</p><p>Envío: ${esc(d.carrier||'Por confirmar')} ${d.trackingNumber?`· Guía: <b>${esc(d.trackingNumber)}</b>`:''}</p>`}catch(e){out.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}const q=new URLSearchParams(location.search).get('id');if(q){document.getElementById('id').value=q;track()}</script></body></html>
